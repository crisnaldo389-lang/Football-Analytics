name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Version de développement du projet, cf. README
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        # La suite tourne hors ligne : les chargeurs StatsBomb sont remplacés par le
        # fixture local, aucun appel à l'API open data n'est fait ici.
        run: pytest -q
